name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.build-and-push.outputs.digest }}

      - name: Wait for registry propagation
        if: github.event_name != 'pull_request'
        run: sleep 10

      - name: Redeploy Portainer stack (API access token)
        if: github.event_name != 'pull_request'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail
          # Espera previa para asegurar disponibilidad del endpoint antes de llamar a Portainer
          sleep 5
          # Normaliza la base: quita '/' final y un sufijo '/api' si viene incluido
          BASE="${PORTAINER_URL%/}"; BASE="${BASE%/api}"
          api() { curl -sS -H "X-API-Key: $PORTAINER_API_KEY" "$@"; }

          # Sanity check: la lista de stacks valida URL + token
          code=$(api -o stacks.json -w '%{http_code}' "$BASE/api/stacks")
          if [ "$code" != "200" ]; then
            echo "::error::GET $BASE/api/stacks devolvió HTTP $code (revisa PORTAINER_URL y PORTAINER_API_KEY)"
            cat stacks.json || true
            exit 1
          fi
          echo "Stacks disponibles (Id | Name | EndpointId):"
          jq -r '.[] | "\(.Id) | \(.Name) | \(.EndpointId)"' stacks.json

          # Verifica que el STACK_ID exista
          if ! jq -e --argjson id "$STACK_ID" 'any(.[]; .Id == $id)' stacks.json >/dev/null; then
            echo "::error::STACK_ID=$STACK_ID no existe. Usa uno de la lista de arriba."
            exit 1
          fi

          # 1) Env actual del stack (se reenvía sin cambios)
          env_json=$(jq --argjson id "$STACK_ID" '[.[] | select(.Id == $id)][0].Env // []' stacks.json)
          # 2) Contenido actual del compose
          file_content=$(api "$BASE/api/stacks/$STACK_ID/file" | jq -r '.StackFileContent')
          # 3) PUT con pullImage=true: re-baja :latest y recrea el contenedor
          jq -n --arg content "$file_content" --argjson env "$env_json" \
            '{stackFileContent:$content, env:$env, prune:false, pullImage:true}' \
            > payload.json
          code=$(api -o put.json -w '%{http_code}' -X PUT \
            -H "Content-Type: application/json" --data @payload.json \
            "$BASE/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID")
          if [ "$code" != "200" ]; then
            echo "::error::PUT stack devolvió HTTP $code"; cat put.json || true; exit 1
          fi
          echo "Stack $STACK_ID redeployado (pullImage=true)."
